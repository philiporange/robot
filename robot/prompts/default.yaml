# Global defaults for Robot
# These settings are inherited by all prompts unless overridden

defaults:
  timeout: 180
  max_retries: 3
  rate_limit: 10

# Default agent preference order (first available is used)
agent_priority:
  - claude
  - agy
  - codex
  - commandcode
  - aider
  - vibe

# Model tier mappings
# Use these to select models by capability rather than name
model_tiers:
  fast:
    claude: haiku
    codex: gpt-5.4-mini
    commandcode: deepseek/deepseek-v4-flash
    agy: gemini-3.5-flash
    vibe: mistral-small
    aider: haiku
  balanced:
    claude: sonnet
    codex: gpt-5.4-mini
    commandcode: deepseek/deepseek-v4-pro
    agy: gemini-3.5-flash
    vibe: mistral-large
    aider: sonnet
  powerful:
    claude: opus
    codex: gpt-5.4-mini
    commandcode: deepseek/deepseek-v4-pro
    agy: gemini-3.1-pro
    vibe: mistral-large
    aider: opus
